spring:
  application:
    name: users

  datasource:
    url: jdbc:h2:mem:usersdb
    driver-class-name: org.h2.Driver
    username: admin
    password: admin

  h2:
    console:
      enabled: true

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  # Resource Server: valida el JWT que emite Cognito.
  # El issuer-uri apunta al User Pool; Spring descarga las llaves publicas (JWKS)
  # desde ese issuer y verifica la firma de cada token automaticamente.
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://us-east-1dajfj59xt.auth.us-east-1.amazoncognito.com

server:
  port: 8686
